server:
  port: 8082
spring:
  devtools:
    restart:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "${AUTH_JWKS_URI:http://localhost:8080}/.well-known/jwks.json"
          issuer-uri: "${AUTH_ISSUER_URI:http://localhost:8080}"
  h2:
    console:
      enabled: false
aws:
  region: "us-east-1"
  dynamodb:
    endpoint: "http://localhost:8000"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,openapi,swagger-ui"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8082"
entrypoint:
  sqs:
    region: "us-east-1"
    queueUrl: "https://sqs.us-east-1.amazonaws.com/155974034244/loan_reports_queue"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
