server:
  port: "${SERVER_HOST:8082}"
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "${AUTH_JWKS_URI:http://localhost:8080}/.well-known/jwks.json"
          issuer-uri: "${AUTH_ISSUER_URI:http://localhost:8080}"
  h2:
    console:
      enabled: false
aws:
  dynamodb:
    endpoint: "${DYNAMO_HOST:http://localhost:8000}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,openapi,swagger-ui"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:8085}"
entrypoint:
  sqs:
    region: "${AWS_REGION:us-east-1}"
    queueUrl: "${SQS_LOAN_QUEUE:https://sqs.us-east-1.amazonaws.com/155974034244/loan_reports_queue}"
    waitTimeSeconds: "${SQS_WAIT_TIME:20}"
    maxNumberOfMessages: "${SQS_MAX_MESSAGE:10}"
    visibilityTimeoutSeconds: "${SQS_VISIBILITY_TIME:10}"
    numberOfThreads: "${SQS_NUMBER_THREADS:1}"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    configUrl: /v3/api-docs/swagger-config
    tryItOutEnabled: true
  show-actuator: true
